<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img">
<title>Doorsong</title>
<desc>A single doorway arch and the sound rising through it, rendered as nested arcs in gradient ink and gold on a warm gradient ground, with a glossy struck point at the base.</desc>
<defs>
<radialGradient id="bg" cx="32%" cy="26%" r="80%">
<stop offset="0%" stop-color="#f7f0e0"/>
<stop offset="55%" stop-color="#e9dbbd"/>
<stop offset="100%" stop-color="#c69a5e"/>
</radialGradient>
<linearGradient id="arch" x1="0%" y1="0%" x2="10%" y2="100%">
<stop offset="0%" stop-color="#4d3c2c"/>
<stop offset="100%" stop-color="#211a14"/>
</linearGradient>
<linearGradient id="ripple" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#e9c273"/>
<stop offset="100%" stop-color="#b3822f"/>
</linearGradient>
<radialGradient id="center" cx="34%" cy="28%" r="70%">
<stop offset="0%" stop-color="#fdedb8"/>
<stop offset="60%" stop-color="#dba847"/>
<stop offset="100%" stop-color="#a3701f"/>
</radialGradient>
<filter id="lift" x="-60%" y="-60%" width="220%" height="220%">
<feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1a1108" flood-opacity="0.35"/>
</filter>
</defs>
<rect x="20" y="20" width="640" height="640" rx="150" fill="url(#bg)"/>
<g filter="url(#lift)">
<path d="M 110 560 A 230 230 0 0 1 570 560" fill="none" stroke="url(#arch)" stroke-width="40" stroke-linecap="round"/>
<path d="M 190 560 A 150 150 0 0 1 490 560" fill="none" stroke="url(#ripple)" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
<path d="M 250 560 A 90 90 0 0 1 430 560" fill="none" stroke="url(#ripple)" stroke-width="11" stroke-linecap="round" opacity="0.55"/>
<circle cx="340" cy="560" r="22" fill="url(#center)"/>
<ellipse cx="333" cy="553" rx="7" ry="5" fill="#fff8e6" opacity="0.6"/>
</g>
</svg>
