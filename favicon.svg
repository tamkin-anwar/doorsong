<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img">
<title>Doorsong</title>
<desc>A single glowing struck note against a deep dusk gradient, abstract, no architecture, no repeats.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="46%" r="78%">
<stop offset="0%" stop-color="#6e4257"/>
<stop offset="45%" stop-color="#3a2440"/>
<stop offset="100%" stop-color="#191225"/>
</radialGradient>
<radialGradient id="orb" cx="36%" cy="30%" r="70%">
<stop offset="0%" stop-color="#ffefc2"/>
<stop offset="45%" stop-color="#f0ab3f"/>
<stop offset="100%" stop-color="#a85f18"/>
</radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="26" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<rect x="20" y="20" width="640" height="640" rx="150" fill="url(#bg)"/>
<circle cx="340" cy="340" r="95" fill="#f0ab3f" opacity="0.35" filter="url(#glow)"/>
<circle cx="340" cy="340" r="95" fill="url(#orb)"/>
<ellipse cx="308" cy="298" rx="26" ry="17" fill="#fff8e6" opacity="0.65"/>
</svg>
